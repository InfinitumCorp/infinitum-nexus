name: Bug report
description: Something is broken in an Infinitum product or shared package
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cumulus://ID / CID
        - Cumulus://Mail
        - Cumulus://Cloud
        - VEIL
        - +SPCTR / Spectre
        - :\ARCHITECT\
        - FABRIC
        - Firmament / FIRM
        - Labyrinth (LBRNTH)
        - SCALVS / METATRON
        - Shared package / monorepo / CI
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, commands, or URLs
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 22 / browser / Android / desktop build id
