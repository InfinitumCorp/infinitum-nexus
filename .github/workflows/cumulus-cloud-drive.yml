name: Cumulus Cloud Drive

# Runs the Drive test suite on the pull request head. It does not deploy.
on:
  pull_request:

# A newer push to the same PR cancels the older run, so minutes are not spent on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Local filesystem and PostgreSQL
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cumulus
          POSTGRES_PASSWORD: cumulus
          POSTGRES_DB: cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cumulus -d cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Ephemeral database on the runner. Not a production credential.
      CUMULUS_CLOUD_DATABASE_URL: postgres://cumulus:cumulus@127.0.0.1:5432/cloud
      CUMULUS_CLOUD_REQUIRE_INTEGRATION: "1"
      # Cumulus://ID's suites also run on PgCidRepository against the same database.
      CID_TEST_PG_URL: postgres://cumulus:cumulus@127.0.0.1:5432/cloud
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @infinitum/cloud typecheck
      - run: pnpm --filter @infinitum/cloud test
      - run: pnpm --filter @infinitum/cid test
      # FIRM Wallet on PgWalletRepository, including two payments racing for one balance.
      - run: pnpm --filter @infinitum/firm exec node --test --experimental-strip-types src/accounts.test.ts
      # CUMULUS_STORE=postgres end to end: accounts become rows, the cid document is no longer saved.
      - run: pnpm --filter @infinitum/spectre exec node --test --experimental-strip-types src/server/cid-store.test.ts src/server/cid-rows.test.ts src/server/local-cid.test.ts
      # Mail end to end on Cumulus://ID rows (CUMULUS_STORE=gateway), before Mail switches.
      - run: pnpm --filter @infinitum/cumulus-mail exec node --test --experimental-strip-types src/cid-gateway.http.test.ts
      # Mail on PgMailRepository: rows, sealing at rest, two deliveries to one mailbox, two senders.
      - run: pnpm --filter @infinitum/mail exec node --test --experimental-strip-types src/postgres.test.ts
