name: Data platform

on:
  pull_request:
    paths:
      - "infra/data-platform/**"
      - "docs/data-platform/**"
      - "supabase/migrations/20261113_data_platform.sql"
      - ".github/workflows/data-platform.yml"
  push:
    branches: [main]
    paths:
      - "infra/data-platform/**"
      - ".github/workflows/data-platform.yml"
  workflow_dispatch:
    inputs:
      datahub:
        description: Also boot the DataHub quickstart (heavy, about 10 minutes)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/data-platform

jobs:
  gateway-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      # Disposable stand-in for the Supabase free-tier database (same major version).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (includes Google DP wheels, Linux only)
        run: pip install -r privacy-gateway/requirements-dev.txt
      - name: Test redaction, quality, DP, the Conjure contract and the Postgres (Supabase) backends
        working-directory: infra/data-platform/privacy-gateway
        run: python -m pytest -W ignore::DeprecationWarning -rs
      - name: Free-tier layout end to end (gateway on Postgres as the restricted role, no OpenSearch)
        working-directory: infra/data-platform/privacy-gateway
        run: |
          # The tests above applied the migration and created data_platform_gateway (CI-only password).
          python -c "import os,psycopg;psycopg.connect(os.environ['TEST_DATABASE_URL'],autocommit=True).execute('truncate data_platform.events, data_platform.datasets, data_platform.privacy_budget')"
          r() { python -c "import secrets;print(secrets.token_hex(32))"; }
          export PRIVACY_GATEWAY_TOKEN=$(r) PRIVACY_PSEUDONYM_KEY=$(r) SPECTRE=$(r) MAIL=$(r)
          export PLATFORM_PRODUCT_TOKENS="spectre=$SPECTRE;cumulus-mail=$MAIL"
          export DATABASE_URL="postgresql://data_platform_gateway:test-only-$(printf 'x%.0s' $(seq 24))@127.0.0.1:5432/postgres"
          python -m cumulus_privacy.server 2> "$RUNNER_TEMP/gateway.log" &
          for i in $(seq 60); do curl -fs http://127.0.0.1:8090/api/v1/health >/dev/null && break; sleep 2; done
          grep -q "(postgres)" "$RUNNER_TEMP/gateway.log"
          python ../smoke/platform_smoke.py http://127.0.0.1:8090 "$SPECTRE" "$MAIL" || { cat "$RUNNER_TEMP/gateway.log"; exit 1; }
          rows=$(python -c "import os,psycopg;print(psycopg.connect(os.environ['TEST_DATABASE_URL']).execute('select count(*) from data_platform.events').fetchone()[0])")
          echo "events stored in Postgres: $rows"; test "$rows" -gt 0
          curl -fsS http://127.0.0.1:8090/api/v1/health | grep -q '"storage": "ok"'
          # Right to erasure: the smoke event's person is erased everywhere with the pipeline token.
          out=$(curl -fsS http://127.0.0.1:8090/api/v1/erasure/subjects/all-products \
            -H "Authorization: Bearer $PRIVACY_GATEWAY_TOKEN" -H 'Content-Type: application/json' -d '{"cid":"cid_smoke0001"}')
          echo "$out"; test "$out" = '{"deleted": 1}'

  conjure:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      CONJURE_VERSION: "4.66.0"
      CONJURE_SHA256: 108fd6481d49f098e71067519331d9d34a257f11a24e3b46e45579fefba09231
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch the Conjure compiler from Maven Central (checksum pinned)
        run: |
          curl -fsSLo "$RUNNER_TEMP/conjure.tgz" "https://repo1.maven.org/maven2/com/palantir/conjure/conjure/$CONJURE_VERSION/conjure-$CONJURE_VERSION.tgz"
          echo "$CONJURE_SHA256  $RUNNER_TEMP/conjure.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/conjure.tgz" -C "$RUNNER_TEMP"
      - name: Compile the contracts to Conjure IR
        run: |
          "$RUNNER_TEMP/conjure-$CONJURE_VERSION/bin/conjure" compile conjure "$RUNNER_TEMP/cumulus-data-platform.conjure.json"
          python3 -c "import json,sys;ir=json.load(open(sys.argv[1]));print('services:',[s['serviceName']['name'] for s in ir['services']])" "$RUNNER_TEMP/cumulus-data-platform.conjure.json"

  stack-smoke:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Write a throwaway .env with random values
        run: |
          r() { python3 -c "import secrets;print(secrets.token_hex(32))"; }
          {
            echo "PRIVACY_GATEWAY_TOKEN=$(r)"
            echo "PRIVACY_PSEUDONYM_KEY=$(r)"
            echo "SUPERSET_SECRET_KEY=$(r)"
            echo "SUPERSET_DB_PASSWORD=$(r)"
            echo "SMOKE_SPECTRE_TOKEN=$(r)"
            echo "SMOKE_MAIL_TOKEN=$(r)"
          } > .env
          . ./.env
          echo "PLATFORM_PRODUCT_TOKENS=\"spectre=$SMOKE_SPECTRE_TOKEN;cumulus-mail=$SMOKE_MAIL_TOKEN\"" >> .env
      - name: Validate compose for every profile
        run: docker compose --profile bi config -q
      - name: Validate the $0 box profile (dummy values)
        run: |
          cp deploy/box/.env.example "$RUNNER_TEMP/box.env"
          sed -i 's/^\([A-Z_]*\)=$/\1=dummy/' "$RUNNER_TEMP/box.env"
          docker compose -f deploy/box/compose.box.yml --env-file "$RUNNER_TEMP/box.env" config -q
      - name: Box ops script accepts a good .env and refuses unsafe ones
        run: |
          r() { python3 -c "import secrets;print(secrets.token_hex(32))"; }
          good="$RUNNER_TEMP/good.env"
          cp deploy/box/.env.example "$good"
          sed -i "s|^PRIVACY_GATEWAY_TOKEN=.*|PRIVACY_GATEWAY_TOKEN=$(r)|; s|^PRIVACY_PSEUDONYM_KEY=.*|PRIVACY_PSEUDONYM_KEY=$(r)|" "$good"
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://data_platform_gateway.ref:pw@db.example:5432/postgres?sslmode=require|" "$good"
          sed -i "s|^SUPERSET_SECRET_KEY=.*|SUPERSET_SECRET_KEY=$(r)|; s|^SUPERSET_DB_PASSWORD=.*|SUPERSET_DB_PASSWORD=$(r)|; s|^CLOUDFLARE_TUNNEL_TOKEN=.*|CLOUDFLARE_TUNNEL_TOKEN=$(r)|" "$good"
          chmod 600 "$good"
          BOX_ENV_FILE="$good" bash deploy/box/box.sh check
          bad() { sed "$1" "$good" > "$RUNNER_TEMP/bad.env"; chmod 600 "$RUNNER_TEMP/bad.env"
                  if BOX_ENV_FILE="$RUNNER_TEMP/bad.env" bash deploy/box/box.sh check; then echo "accepted: $1"; exit 1; fi; }
          bad 's|sslmode=require||'                       # no TLS
          bad 's|data_platform_gateway.ref|postgres.ref|'  # superuser instead of the restricted role
          bad 's|^CLOUDFLARE_TUNNEL_TOKEN=.*|CLOUDFLARE_TUNNEL_TOKEN=|'
          bad 's|^PRIVACY_PSEUDONYM_KEY=.*|PRIVACY_PSEUDONYM_KEY=short|'
      - name: Start core (privacy gateway + OpenSearch)
        run: |
          docker compose up -d --build --wait --wait-timeout 600 privacy-gateway opensearch
          docker compose run --rm opensearch-init
      - name: Redaction works end to end through the container
        run: |
          set -a; . ./.env; set +a
          out=$(curl -fsS http://127.0.0.1:8090/api/v1/redact \
            -H "Authorization: Bearer $PRIVACY_GATEWAY_TOKEN" -H 'Content-Type: application/json' \
            -d '{"destination":"EXCHANGE","records":[{"note":"Ask Jane Doe at jane@example.com or +44 20 7946 0958"}]}')
          echo "$out"
          echo "$out" | python3 -c "import json,sys;b=json.load(sys.stdin);t=b['records'][0]['note'];assert 'jane@example.com' not in t and '7946' not in t, t"
          dp=$(curl -fsS http://127.0.0.1:8090/api/v1/releases/dp \
            -H "Authorization: Bearer $PRIVACY_GATEWAY_TOKEN" -H 'Content-Type: application/json' \
            -d '{"dataset":"smoke","metric":"COUNT","unitKey":"cid","groupKey":"p","publicGroups":["a"],"epsilon":0.5,"rows":[{"cid":"u1","p":"a"},{"cid":"u2","p":"a"}]}')
          echo "$dp"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/api/v1/redact -d '{}')" = 401
      - name: Search template installed
        run: curl -fsS http://127.0.0.1:9200/_index_template/cumulus-events | python3 -c "import json,sys;print(json.load(sys.stdin)['index_templates'][0]['name'])"
      - name: Catalog, collection and search work end to end (real OpenSearch)
        run: |
          set -a; . ./.env; set +a
          python3 smoke/platform_smoke.py http://127.0.0.1:8090 "$SMOKE_SPECTRE_TOKEN" "$SMOKE_MAIL_TOKEN"
      - name: Right to erasure on OpenSearch (delete_by_query)
        run: |
          set -a; . ./.env; set +a
          out=$(curl -fsS http://127.0.0.1:8090/api/v1/erasure/subjects \
            -H "Authorization: Bearer $SMOKE_SPECTRE_TOKEN" -H 'Content-Type: application/json' -d '{"cid":"cid_smoke0001"}')
          echo "$out"; test "$out" = '{"deleted": 1}'
      - name: Start Superset (profile bi)
        run: |
          docker compose --profile bi up -d --build --wait --wait-timeout 900 superset
          curl -fsS http://127.0.0.1:8088/health
          # Sign-in is Cumulus ID only: the login page must offer the cumulus provider.
          curl -fsS http://127.0.0.1:8088/login/ | grep -q cumulus
      - name: Logs on failure
        if: failure()
        run: docker compose --profile bi logs --tail 200
      - name: Stop
        if: always()
        run: docker compose --profile bi down -v

  datahub-quickstart:
    if: github.event_name == 'workflow_dispatch' && inputs.datahub
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Boot DataHub from the pinned quickstart
        run: bash datahub/quickstart.sh
      - name: GMS is healthy
        run: curl -fsS http://localhost:8080/health
      - name: Catalog specs land in DataHub
        working-directory: infra/data-platform/privacy-gateway
        run: |
          pip install -q -r requirements.txt
          python - <<'EOF'
          import json, urllib.parse, urllib.request
          from cumulus_privacy.platform import DataHubSink, dataset_urn, validate_spec
          spec = validate_spec("spectre.deals", {
              "name": "spectre.deals", "product": "spectre", "owners": ["team-spectre"],
              "description": "Deals in the +SPCTR pipeline.", "upstream": [], "retentionDays": 365,
              "region": "EU", "glossaryTerms": ["Deal"],
              "fields": [{"name": "dealId", "type": "string", "classification": "INTERNAL", "rule": "KEEP"},
                         {"name": "note", "type": "string", "classification": "PERSONAL", "rule": "TEXT"}]})
          DataHubSink("http://localhost:8080").push(spec)
          urn = urllib.parse.quote(dataset_urn("spectre.deals"), safe="")
          with urllib.request.urlopen(f"http://localhost:8080/entities/{urn}") as r:
              body = json.load(r)
          text = json.dumps(body)
          assert "Deals in the +SPCTR pipeline." in text and "classification-personal" in text, text[:2000]
          print("DataHub has", dataset_urn("spectre.deals"))
          EOF
      - name: Catalog replay adds physical lineage in DataHub
        working-directory: infra/data-platform/privacy-gateway
        run: |
          python - <<'PY'
          import json, os, tempfile, urllib.parse, urllib.request
          from cumulus_privacy.catalog_sync import CatalogSync, physical_urn
          from cumulus_privacy.platform import Catalog, DataHubSink
          spec = {"name": "spectre.deals", "product": "spectre", "owners": ["team-spectre"],
                  "description": "Deals in the +SPCTR pipeline.", "upstream": [], "retentionDays": 365,
                  "region": "EU", "glossaryTerms": [],
                  "fields": [{"name": "dealId", "type": "string", "classification": "INTERNAL", "rule": "KEEP"}]}
          cat = Catalog(os.path.join(tempfile.mkdtemp(), "c.json"))
          cat.register("spectre", spec["name"], spec)
          out = CatalogSync(cat.all, DataHubSink("http://localhost:8080")).run()
          assert out["failed"] == [] and out["pushed"] == 1, out
          urn = urllib.parse.quote(physical_urn("data_platform.events"), safe="")
          with urllib.request.urlopen(f"http://localhost:8080/entities/{urn}") as r:
              text = json.dumps(json.load(r))
          assert "spectre.deals" in text and "UpstreamLineage" in text, text[:2000]
          print("lineage ok:", out)
          PY
