name: VEIL

on:
  pull_request:
  push:
    branches:
      - cursor/veil-release-main-ea5d

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: VEIL tests, typecheck, lint, and package
        run: |
          pnpm --filter @infinitum/veil test
          pnpm --filter @infinitum/veil typecheck
          pnpm --filter @infinitum/veil lint
          node apps/veil/scripts/package.js
      - name: VEIL routes on the Cumulus ID host
        run: node --test --experimental-strip-types apps/spectre/src/server/veil.http.test.ts

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - name: Desktop tests
        working-directory: apps/veil-desktop
        run: go test ./...
