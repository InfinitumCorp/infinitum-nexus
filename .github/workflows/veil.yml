name: VEIL

on:
  pull_request:
    paths:
      - "apps/veil/**"
      - "apps/veil-desktop/**"
      - "apps/veil-web/**"
      - "apps/veil-android/**"
      - "apps/veil-browser-android/**"
      - "apps/spectre/src/server/veil.http.test.ts"
      - ".github/workflows/veil.yml"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/veil/**"
      - "apps/veil-desktop/**"
      - "apps/veil-web/**"
      - "apps/veil-android/**"
      - "apps/veil-browser-android/**"
      - "apps/spectre/src/server/veil.http.test.ts"
      - ".github/workflows/veil.yml"
      - "pnpm-lock.yaml"

# A newer push to the same PR cancels the older run, so minutes are not spent on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  extension:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: VEIL tests, typecheck, lint, and package
        run: |
          pnpm --filter @infinitum/veil test
          pnpm --filter @infinitum/veil typecheck
          pnpm --filter @infinitum/veil lint
          node apps/veil/scripts/package.js
      - name: VEIL routes on the Cumulus ID host
        run: node --test --experimental-strip-types apps/spectre/src/server/veil.http.test.ts

  scalus:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: SCALVS tests, typecheck, and production build
        run: |
          pnpm --filter @infinitum/scalus test
          pnpm --filter @infinitum/scalus typecheck
          pnpm --filter @infinitum/scalus build
      - name: Build the SCALVS image and smoke-test /health
        run: |
          set -euo pipefail
          docker build -f packages/scalus/Dockerfile -t scalvs-runtime:ci .
          docker rm -f scalvs-smoke >/dev/null 2>&1 || true
          docker run -d --name scalvs-smoke -p 127.0.0.1:3020:3020 scalvs-runtime:ci
          trap 'docker rm -f scalvs-smoke >/dev/null 2>&1 || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3020/health | tee /tmp/scalvs-health.json | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            docker logs scalvs-smoke || true
            exit 1
          fi
          grep -q '"service":"scalvs"' /tmp/scalvs-health.json
          grep -q 'https://scalvs.app' /tmp/scalvs-health.json

  desktop:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
      - name: Desktop tests
        working-directory: apps/veil-desktop
        env:
          GOTOOLCHAIN: go1.26.0
          CGO_ENABLED: "0"
        run: go test ./...

  reproducible:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      GOTOOLCHAIN: go1.26.0
      CGO_ENABLED: "0"
      TZ: UTC
      LC_ALL: C
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.0"
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install wixl for the unsigned MSI
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y wixl
          wixl --version
          test "$(go env GOVERSION)" = "go1.26.0"
          test "$(node --version)" = "v22.23.4"
          test "$(pnpm --version)" = "10.28.0"
      - name: Extension tests
        run: |
          pnpm --filter @infinitum/veil test
          pnpm --filter @infinitum/veil typecheck
          pnpm --filter @infinitum/veil lint
      - name: Extension artifacts match across two builds
        run: bash apps/veil/scripts/repro-check.sh
      - name: Desktop tests
        working-directory: apps/veil-desktop
        run: go test ./...
      - name: Desktop artifacts match across two builds
        run: bash apps/veil-desktop/scripts/repro-check.sh
