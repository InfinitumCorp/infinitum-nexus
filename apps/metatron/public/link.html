<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link an account · METATRON</title>
<style>
  :root { --bg:#fff; --fg:#0d0d0d; --muted:#6e6e73; --line:#ececec; --accent:#0d0d0d; --accent-fg:#fff; --crit:#c4352b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#212121; --fg:#ececec; --muted:#a3a3a8; --line:#323232; --accent:#ececec; --accent-fg:#141414; --crit:#f07468; color-scheme: dark; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  h1 { font-size:22px; font-weight:600; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 18px; }
  button { font:inherit; border:0; border-radius:999px; padding:10px 20px; background:var(--accent); color:var(--accent-fg); cursor:pointer; }
  button[disabled] { opacity:.4; cursor:default; }
  .err { color:var(--crit); }
  small { display:block; margin-top:22px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Link an account</h1>
  <p id="msg">You'll sign in on your bank's own page. METATRON never sees your password.</p>
  <button id="go" disabled>Continue</button>
  <small>Connections run through Plaid. You can disconnect at any time in METATRON, and every connection is recorded on Firmament.</small>
</main>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const code = new URLSearchParams(location.hash.slice(1)).get("code");
  history.replaceState(null, "", location.pathname); // keep the one-time code out of history
  const fail = (text) => { $("msg").textContent = text; $("msg").className = "err"; $("go").disabled = true; };
  if (!code) return fail("This link has expired. Start again from METATRON.");
  if (!window.Plaid) return fail("Couldn't load the secure connection window. Check your connection and try again.");
  let token;
  try {
    const r = await fetch("/link/token", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, investments: true }) });
    const j = await r.json();
    if (!r.ok) return fail(j.error || "Couldn't start linking. Try again from METATRON.");
    token = j.linkToken;
  } catch { return fail("Couldn't reach METATRON. Try again."); }
  const handler = Plaid.create({
    token,
    onSuccess: async (publicToken, meta) => {
      $("title").textContent = "Connecting…";
      $("msg").textContent = "Saving your connection.";
      $("go").disabled = true;
      try {
        const r = await fetch("/link/exchange", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, publicToken, institution: meta && meta.institution ? meta.institution.name : "" }) });
        const j = await r.json();
        if (!r.ok) return fail(j.error || "Couldn't save the connection.");
        $("title").textContent = "Connected";
        $("msg").textContent = (j.institution || "Your account") + " is linked. You can close this window and return to METATRON.";
        $("msg").className = "";
      } catch { fail("Couldn't reach METATRON to save the connection."); }
    },
    onExit: (err) => { if (err) fail(err.display_message || "Linking was cancelled. You can close this window."); },
  });
  $("go").disabled = false;
  $("go").addEventListener("click", () => handler.open());
})();
</script>
</body>
</html>
