<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VEIL</> Search</title>
  <meta name="theme-color" content="#ffffff" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="icons/icon-192.png" />
  <style>
    :root {
      --bg: #ffffff; --ink: #111820; --ink-quiet: #6b6b74; --slate: #49545e; --rule: #e8e8ec;
      --hover: #f3f3f5; --focus: #1f5fd6; --accent: #5b3fd1; --link: #1a0dab;
      --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color-scheme: light;
    }
    @media (prefers-contrast: more) { :root { --ink-quiet: var(--ink); --rule: #9a9aa3; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body { color: var(--ink); font: 15px/1.5 var(--font); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: env(safe-area-inset-top, 0px) 16px 0; min-height: 64px; background: #fff; border-bottom: 1px solid var(--rule); }
    .brand { display: inline-flex; align-items: center; font-size: 19px; letter-spacing: -0.04em; text-decoration: none; color: var(--ink); white-space: nowrap; }
    .brand sup { font-size: .5em; letter-spacing: 0; margin-left: 1px; align-self: flex-start; margin-top: 4px; }
    .search { flex: 1; max-width: 640px; margin: 0; }
    .search input { width: 100%; font: inherit; font-size: 16px; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; color: var(--ink); -webkit-appearance: none; appearance: none; }
    .search input:focus { outline: none; border-color: var(--ink); }

    main { width: min(680px, 100% - 32px); margin: 0 0 0 max(16px, calc((100% - 1100px) / 2 + 16px)); padding: 12px 0 48px; flex: 1; }
    .meta { font-size: 12px; color: var(--ink-quiet); margin: 4px 0 14px; display: flex; align-items: center; gap: 7px; }
    .meta::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
    .result { padding: 12px 0 14px; border-bottom: 1px solid var(--rule); }
    .result:last-child { border-bottom: 0; }
    .site { display: block; font-size: 12px; color: var(--slate); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .title { display: block; margin: 2px 0 4px; font-size: 18px; line-height: 1.3; color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
    .title:hover, .title:focus-visible { text-decoration: underline; }
    .title:visited { color: #5e2d91; }
    .snippet { margin: 0; font-size: 14px; color: #3c4043; overflow-wrap: anywhere; }
    .notice { padding: 24px 0; color: var(--ink-quiet); }
    .notice button, .more { margin-top: 12px; padding: 10px 18px; border: 1px solid var(--rule); border-radius: 2px; background: #fff; }
    .notice button:hover, .more:hover { background: var(--hover); }
    .more { display: block; width: 100%; margin-top: 20px; }
    .skeleton { height: 76px; margin: 12px 0; background: linear-gradient(90deg, var(--hover) 25%, #fafafb 50%, var(--hover) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 2px; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
    footer { margin: 0 16px; padding: 14px 0 max(14px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-quiet); }
    @media (max-width: 560px) {
      .topbar { gap: 10px; padding-left: 12px; padding-right: 12px; }
      .brand { font-size: 17px; }
      main { margin: 0 auto; }
      .title { font-size: 17px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand" href="./">VEIL&lt;/&gt;<sup>™</sup></a>
    <form class="search" role="search" id="search-form">
      <input id="q" type="search" enterkeyhint="search" placeholder="Search privately or enter address" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search privately or enter address" />
    </form>
  </header>
  <main id="main" aria-live="polite">
    <p class="meta" id="meta" hidden></p>
    <div id="results"></div>
    <button type="button" class="more" id="more" hidden>More results</button>
  </main>
  <footer>VEIL searches for you: the search engine never sees your address, and nothing is kept.</footer>
  <script src="lib/trackers.js"></script>
  <script src="search.js"></script>
</body>
</html>
