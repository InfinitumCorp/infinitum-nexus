<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FIRM Wallet™</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="brand.css" />
  <style>
    /* Brand from brand.css: white, Helvetica Neue, wordmark with ™. */
    body { padding: 1rem; font-size: 14px; }
    .wordmark { margin: 0 0 0.75rem; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 0.875rem; margin-bottom: 0.75rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    button { background: var(--ink); color: var(--paper); border: none; padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; font-weight: 500; }
  </style>
</head>
<body>
  <h1 class="wordmark">FIRM Wallet<sup class="tm">™</sup></h1>
  <div class="card">
    <div class="muted">Address</div>
    <div id="addr">Not connected</div>
    <div id="bal" class="muted">Balance: —</div>
    <button id="connect" style="margin-top:0.5rem">Connect (scaffold)</button>
  </div>
  <script type="module" src="wallet.js"></script>
</body>
</html>
