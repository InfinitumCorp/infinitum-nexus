<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FIRM Wallet</title>
  <style>
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; background: #0a0a0a; color: #f5f5f5; padding: 1rem; }
    .card { border: 1px solid #222; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.75rem; }
    .muted { color: #888; font-size: 0.85rem; }
    button { background: #fff; color: #000; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <div class="card">
    <div class="muted">FIRM Wallet</div>
    <div id="addr">Not connected</div>
    <div id="bal" class="muted">Balance: —</div>
    <button id="connect" style="margin-top:0.5rem">Connect (scaffold)</button>
  </div>
  <script type="module" src="wallet.js"></script>
</body>
</html>
