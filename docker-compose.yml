services:
  spectre:
    build:
      context: .
      dockerfile: apps/spectre/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SPECTRE_WORKSPACE: demo
      ARCHITECT_URL: http://architect:3001
    depends_on:
      - architect

  architect:
    build:
      context: .
      dockerfile: apps/architect/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      SPECTRE_URL: http://spectre:3000
